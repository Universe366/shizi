<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>示例插件</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1f2328;
        --muted: #6b7280;
        --bg: #ffffff;
        --line: rgba(127, 127, 127, 0.24);
        --accent: #4f6f8f;
      }
      body {
        margin: 0;
        padding: 12px;
        font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      button {
        margin: 0 6px 6px 0;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      pre {
        margin: 8px 0 0;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>示例插件</h1>
    <div class="hint">这个面板通过 postMessage 调用宿主能力，没有 Node 访问权限。</div>
    <p>
      <button data-action="page">读取当前页面</button>
      <button data-action="library">最近入库</button>
      <button data-action="count">点我 +1（写入插件存储）</button>
      <button data-action="open">在新标签页打开 B 站</button>
    </p>
    <pre id="out">等待操作…</pre>

    <script>
      const pending = new Map();
      let seq = 0;

      function call(method, params) {
        return new Promise((resolve, reject) => {
          const id = String(++seq);
          pending.set(id, { resolve, reject });
          parent.postMessage({ source: 'shizi-plugin', id, method, params }, '*');
        });
      }

      window.addEventListener('message', (event) => {
        const data = event.data || {};
        if (data.source !== 'shizi-host') return;
        const task = pending.get(data.id);
        if (!task) return;
        pending.delete(data.id);
        if (data.ok) task.resolve(data.data);
        else task.reject(new Error(data.error || '调用失败'));
      });

      const out = document.getElementById('out');
      const show = (value) => {
        out.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
      };

      async function applyTheme() {
        try {
          const theme = await call('theme.get');
          const dark = theme.theme === 'dark';
          document.documentElement.style.setProperty('--bg', dark ? '#17181a' : '#ffffff');
          document.documentElement.style.setProperty('--fg', dark ? '#e6e6e6' : '#1f2328');
          document.documentElement.style.setProperty('--accent', theme.accentColor || '#4f6f8f');
        } catch {
          /* 主题只是锦上添花 */
        }
      }

      document.querySelectorAll('button[data-action]').forEach((button) => {
        button.addEventListener('click', async () => {
          try {
            const action = button.dataset.action;
            if (action === 'page') show(await call('page.info'));
            if (action === 'library') show(await call('library.query', { limit: 5 }));
            if (action === 'count') {
              const current = (await call('storage.get', { key: 'clicks' })) || 0;
              await call('storage.set', { key: 'clicks', value: current + 1 });
              show('累计点击 ' + (current + 1) + ' 次');
            }
            if (action === 'open') show(await call('tabs.open', { url: 'https://www.bilibili.com' }));
          } catch (error) {
            show(String(error.message || error));
          }
        });
      });

      applyTheme();
    </script>
  </body>
</html>
