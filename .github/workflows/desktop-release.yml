name: Desktop + Extension Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '桌面版本号（例如 0.37.3）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match desktop/package.json $pkg"
            exit 1
          fi
          echo "version $pkg matches tag $GITHUB_REF_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # node_modules 直接缓存：命中时跳过 npm ci（这是发布链路里最慢的一步，约 78s）。
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: desktop/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      # electron-builder 的 winCodeSign / nsis 等工具缓存，避免每次重新下载。
      - name: Cache electron-builder tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Install dependencies
        shell: bash
        run: |
          if [ -d node_modules/electron ]; then
            echo "node_modules cache hit, skip npm ci"
          else
            npm ci --prefer-offline --no-audit --no-fund
          fi
      - run: npm run typecheck
      - run: npm run lint
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-log
          path: desktop/test.log
          if-no-files-found: ignore
          retention-days: 7

      - run: npm run build

      - name: Smoke (real Electron)
        run: npm run smoke

      - run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Prepare green package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $dir = 'release/win-unpacked'
          @"
          拾字 $version 绿色版

          1. 进入本目录，双击 拾字.exe。
          2. 数据保存在 %APPDATA%\shizi（旧版 bsub-desktop 自动迁移）。
          "@ | Set-Content -Path "$dir/README.txt" -Encoding UTF8
          Compress-Archive -Path "$dir/*" -DestinationPath "release/shizi-$version-win-x64-green.zip" -Force

      - name: Package browser extension
        shell: pwsh
        run: |
          $extVersion = (Get-Content ../shizi-extension/manifest.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path ../shizi-extension -DestinationPath "release/shizi-extension-v$extVersion.zip" -Force
          Write-Output "extension=$extVersion"

      - run: npm run release:notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: 桌面端 + 插件 ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          body_path: desktop/release/release-notes.md
          files: |
            desktop/release/shizi-setup-*.exe
            desktop/release/shizi-*.zip
            desktop/release/shizi-extension-*.zip
            desktop/release/latest.yml
            desktop/release/*.blockmap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
